<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Game - Tu portal de videojuegos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph for Social Sharing -->
    <meta property=og:title content="Creative Game">
    <meta property=og:description content="Tu portal de videojuegos premium.">
    <meta property=og:image content="https://carley-interactive-studio.github.io/logo.png">
    <meta property=og:type content="website">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-container" id="logo-menu-btn">
                <img src="logo.png" alt="Creative Game Logo" class="logo-img">
                <span class="logo-text">Creative <span class="gold-text">Game</span></span>
                <div id="logo-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-header">Mundo Social</div>
                    <a href="mundo.html" class="dropdown-item">
                        <img src="images/icons/share.svg" class="small-icon"> Comunidad (Mundo)
                    </a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-header">Dispositivos</div>
                    <a href="#" class="dropdown-item" onclick="filterByDevice('pc')">
                        <img src="images/icons/pc.svg" class="small-icon"> PC
                    </a>
                    <a href="#" class="dropdown-item" onclick="filterByDevice('mobile')">
                        <img src="images/icons/mobile.svg" class="small-icon"> Móvil
                    </a>
                    <a href="#" class="dropdown-item" onclick="filterByDevice('tv')">
                        <img src="images/icons/tv.svg" class="small-icon"> TV
                    </a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-header">Categorías</div>
                    <ul id="categories-list">
                        <!-- Categorías dinámicas -->
                    </ul>
                    <div class="dropdown-divider"></div>
                    <a href="consola.html" id="console-mode-btn" class="dropdown-item gold-hover">
                        <img src="images/icons/console.svg" alt="Console" class="small-icon">
                        Modo Consola
                    </a>
                </div>
            </div>

            <div class="search-container">
                <div class="search-bar">
                    <img src="images/icons/search.svg" alt="Search" class="search-icon">
                    <input type="text" id="game-search" placeholder="Buscar juegos, categorías..." autocomplete="off">
                </div>
            </div>

            <div class="account-container">
                <div id="notif-container" class="hidden">
                    <div class="notification-btn" id="notif-btn">
                        <img src="images/icons/bell.svg" alt="Notificaciones" class="small-icon">
                        <span class="notification-badge hidden" id="notif-count">0</span>
                    </div>
                    <div id="notif-dropdown" class="notifications-dropdown hidden">
                        <div class="notif-header">
                            <span>Notificaciones</span>
                        </div>
                        <div class="notif-list" id="notif-list">
                            <p class="empty-msg" style="text-align:center; padding: 2rem;">No tienes notificaciones.</p>
                        </div>
                    </div>
                </div>
                <a href="cuenta.html" id="account-link" class="profile-btn">
                    <img src="images/icons/user.svg" alt="Cuenta" class="user-icon">
                </a>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div id="hero-section">
            <!-- Destacado opcional -->
        </div>
        <div id="sections-container">
            <!-- Secciones de juegos dinámicas (Scroll horizontal) -->
            <div class="loading-spinner">Cargando juegos...</div>
        </div>
    </main>


    <footer class="main-footer">
        <p>&copy; 2026 Creative <span class="gold-text">Game</span>. Todos los derechos reservados.</p>
    </footer>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
