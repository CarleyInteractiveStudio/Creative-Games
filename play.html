<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game - Creative Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="game-play-area">
            <!-- This is where the game would be embedded -->
            <div class="game-placeholder">
                <p>Game Area</p>
            </div>
        </div>
        <div class="game-details">
            <h2>Sample Game 1</h2>
            <div class="game-card-info">
                <div class="platform-icons">
                    <img src="images/icons/pc.svg" alt="PC">
                    <img src="images/icons/console.svg" alt="Console">
                </div>
                <div class="interaction-buttons">
                    <button class="icon-button"><img src="images/icons/like.svg" alt="Like"></button>
                    <button class="icon-button"><img src="images/icons/dislike.svg" alt="Dislike"></button>
                    <button class="icon-button"><img src="images/icons/favorite.svg" alt="Favorite"></button>
                </div>
            </div>
            <p>This is a sample game description. It's a fun and exciting game that you're sure to enjoy!</p>
            <h3>Controls</h3>
            <p>W, A, S, D to move. Mouse to aim and shoot.</p>
        </div>
        <section class="game-catalog">
            <h2>You might also like</h2>
            <div class="game-grid">
                <div class="game-card">
                    <a href="play.html">
                        <img src="games/sample-game/images/thumbnail.png" alt="Sample Game">
                        <div class="game-card-title">Sample Game 2</div>
                    </a>
                </div>
                <div class="game-card">
                    <a href="play.html">
                        <img src="games/sample-game/images/thumbnail.png" alt="Sample Game">
                        <div class="game-card-title">Sample Game 3</div>
                    </a>
                </div>
                <div class="game-card">
                    <a href="play.html">
                        <img src="games/sample-game/images/thumbnail.png" alt="Sample Game">
                        <div class="game-card-title">Sample Game 4</div>
                    </a>
                </div>
            </div>
        </section>
        <p><a href="index.html">Back to Home</a></p>
    </div>
</body>
</html>
