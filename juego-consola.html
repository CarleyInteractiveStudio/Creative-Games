<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando Juego... - Creative Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/consola.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        .console-player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Pause Overlay overrides for standalone page */
        .pause-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- Open Graph for Social Sharing -->
    <meta property=og:title content="Creative Game">
    <meta property=og:description content="Tu portal de videojuegos premium.">
    <meta property=og:image content="https://carley-interactive-studio.github.io/logo.png">
    <meta property=og:type content="website">
</head>
<body class="console-mode">
    <div id="loading-screen" class="loading-screen">
        <div class="pulsing-icon">
            <img src="logo.png" alt="Logo" style="width: 120px;">
        </div>
        <h2 class="gold-text" id="loading-title">Cargando Título...</h2>
    </div>

    <div class="console-player-container">
        <iframe id="game-frame" src="about:blank" allowfullscreen></iframe>

        <!-- Console Pause Menu -->
        <div id="pause-menu" class="pause-overlay hidden">
            <div class="pause-content glass-card">
                <h2 class="gold-text">MENU DE CONSOLA</h2>
                <p id="pause-game-title" style="margin-bottom: 2rem; color: var(--text-gray);"></p>
                <div class="pause-options">
                    <button class="pause-btn active" data-index="0">REANUDAR JUEGO</button>
                    <button class="pause-btn" data-index="1">REINICIAR JUEGO</button>
                    <button class="pause-btn" data-index="2">SALIR A CONSOLA</button>
                </div>
                <div class="pause-hints" id="pause-hints">
                    <!-- Dynamic Hints -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/juego-consola.js"></script>
</body>
</html>
