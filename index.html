<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Game - Tu portal de videojuegos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-container" id="logo-menu-btn">
                <img src="logo.png" alt="Creative Game Logo" class="logo-img">
                <span class="logo-text">Creative <span class="gold-text">Game</span></span>
                <div id="logo-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-header">Categorías</div>
                    <ul id="categories-list">
                        <!-- Categorías dinámicas -->
                    </ul>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="console-mode-btn" class="dropdown-item gold-hover">
                        <img src="images/icons/console.svg" alt="Console" class="small-icon">
                        Modo Consola
                    </a>
                </div>
            </div>

            <div class="search-container">
                <div class="search-bar">
                    <img src="images/icons/search.svg" alt="Search" class="search-icon">
                    <input type="text" id="game-search" placeholder="Buscar juegos, categorías..." autocomplete="off">
                </div>
            </div>

            <div class="account-container">
                <a href="cuenta.html" id="account-link" class="profile-btn">
                    <img src="images/icons/user.svg" alt="Cuenta" class="user-icon">
                </a>
            </div>
        </div>
    </header>

    <main id="main-content">
        <!-- Profile Management Section (Hidden if not logged in) -->
        <div id="profile-management-bar" class="profile-management-bar hidden">
            <div class="profile-bar-content">
                <div class="user-brief">
                    <span class="welcome-msg">Hola, <span id="user-name-display" class="gold-text">Usuario</span></span>
                </div>
                <div class="profile-actions">
                    <button id="open-profile-settings" class="btn-profile-action">
                        <img src="images/icons/settings.svg" alt="Ajustes" class="small-icon">
                        Editar Perfil
                    </button>
                </div>
            </div>
        </div>

        <div id="hero-section">
            <!-- Destacado opcional -->
        </div>
        <div id="sections-container">
            <!-- Secciones de juegos dinámicas (Scroll horizontal) -->
            <div class="loading-spinner">Cargando juegos...</div>
        </div>
    </main>

    <!-- Profile Settings Modal -->
    <div id="profile-modal" class="modal-overlay hidden">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2>Ajustes de Perfil</h2>
                <button id="close-profile-modal" class="btn-close">&times;</button>
            </div>
            <form id="profile-update-form">
                <div class="form-group">
                    <label for="new-username">Nombre de Usuario</label>
                    <input type="text" id="new-username" class="form-input" placeholder="Tu nuevo nombre" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2024 Creative Game. Todos los derechos reservados.</p>
    </footer>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
