<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Juegos - Creative Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .search-results-header {
            margin-bottom: 2rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .filter-pill {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-pill.active {
            background: var(--gold);
            color: black;
            border-color: var(--gold);
        }
    </style>

    <!-- Open Graph for Social Sharing -->
    <meta property=og:title content="Creative Game">
    <meta property=og:description content="Tu portal de videojuegos premium.">
    <meta property=og:image content="https://carley-interactive-studio.github.io/logo.png">
    <meta property=og:type content="website">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-container" onclick="location.href='index.html'">
                <img src="logo.png" alt="Creative Game Logo" class="logo-img">
                <span class="logo-text">Creative <span class="gold-text">Game</span></span>
            </div>
            <div class="search-container">
                <div class="search-bar">
                    <img src="images/icons/search.svg" alt="Search" class="search-icon">
                    <input type="text" id="game-search" placeholder="Buscar de nuevo..." autocomplete="off">
                </div>
            </div>
            <div class="account-container">
                <a href="mundo.html" class="profile-btn" title="Mundo">
                    <img src="images/icons/share.svg" alt="Mundo" class="user-icon" style="filter: invert(1);">
                </a>
                <a href="cuenta.html" class="profile-btn">
                    <img src="images/icons/user.svg" alt="Cuenta" class="user-icon" style="filter: invert(1);">
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="search-results-header">
            <h1 id="search-query-display">Resultados para: <span class="gold-text">...</span></h1>
            <div id="filter-container" style="margin-top: 1rem;">
                <span class="filter-pill active" onclick="filterResults('all')">Todos</span>
                <span class="filter-pill" onclick="filterResults('pc')">PC</span>
                <span class="filter-pill" onclick="filterResults('mobile')">Móvil</span>
                <span class="filter-pill" onclick="filterResults('console')">Consola</span>
            </div>
        </section>

        <div id="search-results-grid" class="results-grid">
            <!-- Results load here -->
            <div class="loading-spinner">Buscando juegos...</div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Creative <span class="gold-text">Game</span>. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/buscar.js"></script>
</body>
</html>
