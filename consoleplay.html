<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Game - Jugando</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            height: 100%;
            width: 100%;
        }
        #game-container {
            width: 100%;
            height: 100%;
            border: none;
        }
        #game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-message {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 1.5rem;
        }
        .floating-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .floating-menu button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s ease;
        }
        .floating-menu button:hover {
            background: #FFC107;
            color: #121212;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="error-message" class="error-message hidden">
        <p>¡Ups! Ocurrió un error al cargar el juego. Lo sentimos.</p>
    </div>

    <div id="floating-menu" class="floating-menu hidden">
        <button id="restart-btn">Reiniciar</button>
        <button id="return-btn">Regresar</button>
    </div>

    <script src="js/games.js"></script>
    <script src="js/consoleplay.js"></script>
</body>
</html>
