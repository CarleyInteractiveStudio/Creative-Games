<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game - Creatives Games</title>
    <link rel="icon" href="images/logo/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/play.css">
</head>
<body>
    <header class="floating-header">
        <div class="header-container">
            <a href="index.html" class="logo-link"><img src="images/logo/logo.png" alt="Creatives Games Logo" class="logo"></a>
            <div class="header-bubble search-bubble">
                <div class="search-bar">
                    <input type="text" placeholder="Search...">
                    <button class="icon-button" aria-label="Search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
            </div>
            <div class="header-bubble">
                <button class="icon-button" aria-label="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <div class="profile-menu-container">
                    <button id="profile-menu-button" class="icon-button" aria-label="Profile">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>
                    <div id="profile-dropdown" class="dropdown-menu hidden">
                        <a href="login.html">Iniciar Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <div id="play-container">
        <div id="game-content-column">
            <div id="game-play-area">
                <!-- Iframe del juego se cargará aquí -->
            </div>
            <h1 id="game-title"></h1>
            <div id="game-actions-bar">
                <!-- Botones de acción (like, dislike, etc.) se cargarán aquí -->
            </div>
            <p id="game-description"></p>

            <!-- Burbuja de Detalles del Juego -->
            <div id="details-bubble">
                <p><strong>Developer:</strong> <span id="bubble-developer"></span></p>
                <p><strong>Engine:</strong> <span id="bubble-engine"></span></p>
                <p><strong>Rating:</strong> <span id="bubble-rating"></span></p>
                <p><strong>Release Date:</strong> <span id="bubble-release-date"></span></p>
                <p><strong>Last Update:</strong> <span id="bubble-last-update"></span></p>
            </div>

            <div id="social-links">
                <!-- Enlaces a redes sociales se cargarán aquí -->
            </div>
        </div>
        <div id="similar-games-column">
            <h2>Similar Games</h2>
            <div id="similar-games-catalog">
                <!-- Tarjetas de juegos similares se cargarán aquí -->
            </div>
        </div>
    </div>

    <!-- Modal para Detalles del Juego (oculto por defecto) -->
    <div id="details-modal" class="modal-hidden">
        <div class="modal-content">
            <button id="close-modal-button" class="icon-button">&times;</button>
            <h3>Controls</h3>
            <div id="modal-details-content">
                <p id="modal-controls"></p>
            </div>
        </div>
    </div>

    <div id="gamepad-notification">
        Mando detectado. Presiona <strong>MODE</strong> para entrar al Modo Consola.
    </div>
    <script src="js/games.js"></script>
    <script src="js/main.js"></script>
    <script src="js/play.js"></script>
</body>
</html>
