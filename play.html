<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game - Creative Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/play.css">
</head>
<body>
    <div id="play-container">
        <div id="game-content-column">
            <div id="game-play-area">
                <!-- Iframe del juego se cargará aquí -->
            </div>
            <h1 id="game-title"></h1>
            <div id="game-actions-bar">
                <!-- Botones de acción (like, dislike, etc.) se cargarán aquí -->
            </div>
            <p id="game-description"></p>
            <div id="social-links">
                <!-- Enlaces a redes sociales se cargarán aquí -->
            </div>
        </div>
        <div id="similar-games-column">
            <h2>Similar Games</h2>
            <div id="similar-games-catalog">
                <!-- Tarjetas de juegos similares se cargarán aquí -->
            </div>
        </div>
    </div>

    <!-- Modal para Detalles del Juego (oculto por defecto) -->
    <div id="details-modal" class="modal-hidden">
        <div class="modal-content">
            <button id="close-modal-button" class="icon-button">&times;</button>
            <h3>Game Details</h3>
            <div id="modal-details-content">
                <p><strong>Developer:</strong> <span id="modal-developer"></span></p>
                <p><strong>Engine:</strong> <span id="modal-engine"></span></p>
                <p><strong>Rating:</strong> <span id="modal-rating"></span></p>
                <p><strong>Release Date:</strong> <span id="modal-release-date"></span></p>
                <p><strong>Last Update:</strong> <span id="modal-last-update"></span></p>
                <h4>Controls</h4>
                <p id="modal-controls"></p>
            </div>
        </div>
    </div>

    <script src="js/games.js"></script>
    <script src="js/play.js"></script>
</body>
</html>
