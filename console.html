<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatives Games - Modo Consola</title>
    <link rel="icon" href="images/logo/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/console.css">
</head>
<body class="console-mode">
    <div class="console-layout-wrapper">
        <header class="console-header">
            <div class="header-container">
                <a href="index.html" class="logo-link"><img src="images/logo/logo.png" alt="Creatives Games Logo" class="logo"></a>
                <div class="header-bubble search-bubble">
                <div class="search-bar">
                    <input type="text" placeholder="Buscar...">
                    <button class="icon-button" aria-label="Buscar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
            </div>
            <div class="header-bubble">
                <button class="icon-button" aria-label="Notificaciones">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <div class="profile-menu-container">
                    <button id="profile-menu-button" class="icon-button" aria-label="Perfil">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>
                    <div id="profile-dropdown" class="dropdown-menu hidden">
                        <a href="account.html">
                            <img src="images/icons/user.svg" alt="Mi Cuenta" class="dropdown-icon">
                            <span>Mi Cuenta</span>
                        </a>
                        <a href="favorites.html">
                            <img src="images/icons/favorite.svg" alt="Juegos Favoritos" class="dropdown-icon">
                            <span>Juegos Favoritos</span>
                        </a>
                        <a href="history.html">
                            <img src="images/icons/history.svg" alt="Historial de Jugados" class="dropdown-icon">
                            <span>Historial de Jugados</span>
                        </a>
                        <a href="configuracion.html">
                            <img src="images/icons/settings.svg" alt="Configuración" class="dropdown-icon">
                            <span>Configuración</span>
                        </a>
                        <a href="dashboard.html" id="developer-dashboard-link" class="hidden">
                            <img src="images/icons/console.svg" alt="Panel de Desarrollador" class="dropdown-icon">
                            <span>Panel de Desarrollador</span>
                        </a>
                        <a href="login.html">Iniciar Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="console-container">
        <div class="category-filters-container">
            <div id="category-filters" class="category-filters">
                <!-- Las categorías se cargarán dinámicamente aquí -->
            </div>
        </div>

        <div class="game-carousel-container">
            <div id="game-carousel" class="game-carousel">
                <!-- El carrusel de juegos se cargará dinámicamente aquí -->
            </div>
        </div>
    </main>
</div>

    <div id="game-details-bubble" class="details-bubble">
        <div class="details-left">
            <h2 id="details-title" class="game-title"></h2>
            <div id="details-short-description" class="short-description"></div>
            <div id="details-description" class="description-scroll">
                <!-- La descripción y detalles del juego irán aquí -->
            </div>
        </div>
        <div class="details-right">
            <div id="details-controls" class="controls-info">
                <!-- La información de los controles del juego irá aquí -->
            </div>
            <div class="interaction-buttons">
                <button id="like-btn" class="icon-button"><img src="images/icons/like.svg" alt="Me gusta"></button>
                <button id="dislike-btn" class="icon-button"><img src="images/icons/dislike.svg" alt="No me gusta"></button>
                <button id="favorite-btn" class="icon-button"><img src="images/icons/favorite.svg" alt="Favorito"></button>
                <button id="share-btn" class="icon-button"><img src="images/icons/share.svg" alt="Compartir"></button>
            </div>
            <button id="details-toggle-btn" class="details-button">Detalles</button>
        </div>
    </div>

    <script src="js/games.js"></script>
    <script src="js/main.js"></script>
    <script src="js/console.js"></script>
    <script src="js/gamepad-navigation.js"></script>
</body>
</html>
