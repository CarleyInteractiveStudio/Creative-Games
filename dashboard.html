<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard - Creative Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Developer Dashboard</h2>
        <div class="account-section">
            <a href="upload.html" class="button">Upload a New Game</a>
        </div>
        <div class="account-section">
            <h3>Your Games</h3>
            <div class="game-grid">
                <!-- Sample Game 1 -->
                <div class="game-card">
                    <img src="games/sample-game/images/thumbnail.png" alt="Sample Game">
                    <div class="game-card-title">Sample Game 1</div>
                    <div class="game-stats">
                        <p>Players: 1,234</p>
                        <p>Likes: 123</p>
                        <p>Dislikes: 4</p>
                    </div>
                    <a href="upload.html" class="button">Update Game</a>
                </div>
                <!-- Sample Game 2 -->
                <div class="game-card">
                    <img src="games/sample-game/images/thumbnail.png" alt="Sample Game">
                    <div class="game-card-title">Sample Game 2</div>
                    <div class="game-stats">
                        <p>Players: 5,678</p>
                        <p>Likes: 456</p>
                        <p>Dislikes: 23</p>
                    </div>
                    <a href="upload.html" class="button">Update Game</a>
                </div>
            </div>
        </div>
        <p><a href="index.html">Back to Home</a></p>
    </div>
</body>
</html>
