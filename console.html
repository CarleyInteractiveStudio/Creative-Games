<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Consola - Creative Game</title>
    <link rel="stylesheet" href="css/console.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="console-mode">
    <header class="console-header">
        <div class="logo-container">
            <h1 class="logo-text">Creative Game</h1>
        </div>
        <div class="search-container" id="search-container">
            <input type="text" id="console-search" placeholder="Search games..." readonly>
        </div>
        <div class="header-icons">
            <button id="profile-btn" class="header-icon-btn"><img src="images/icons/profile.svg" alt="Profile"></button>
        </div>
    </header>

    <nav class="console-category-nav" id="category-nav">
        <!-- Categorías dinámicas -->
    </nav>

    <main class="console-content" id="main-content">
        <!-- Carruseles de juegos por categoría -->
    </main>

    <!-- Barra de información inferior -->
    <div id="info-bar" class="info-bar">
        <!-- Contenido dinámico -->
    </div>

    <!-- Panel de detalles flotante -->
    <aside id="details-panel" class="details-panel">
        <div class="details-header">
            <h2>Game Details</h2>
            <button id="close-details" class="close-btn">&times;</button>
        </div>
        <div id="details-content" class="details-content">
            <!-- Detalles del juego -->
        </div>
    </aside>

    <!-- Teclado virtual -->
    <div id="keyboard-overlay" class="keyboard-overlay hidden">
        <div class="keyboard-container">
            <div class="keyboard-header">
                <input type="text" id="keyboard-input" placeholder="Type to search...">
                <button id="keyboard-done" class="kb-btn action-btn">Done</button>
            </div>
            <div id="keyboard-keys" class="keyboard-keys">
                <!-- Teclas dinámicas -->
            </div>
        </div>
    </div>

    <script src="js/games.js"></script>
    <script src="js/console.js"></script>
</body>
</html>
