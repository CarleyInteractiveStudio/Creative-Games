<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <button id="hamburger-menu-button" class="icon-button" aria-label="Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1 class="logo">Creative Game</h1>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for games...">
                <button class="icon-button" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <div class="header-right">
                <button class="icon-button" aria-label="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <div class="profile-menu-container">
                    <button id="profile-menu-button" class="icon-button" aria-label="Profile">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>
                    <div id="profile-dropdown" class="dropdown-menu hidden">
                        <a href="login.html">Login</a>
                        <a href="upload.html">Upload Game</a>
                    </div>
                </div>
            </div>
        </div>
        <nav id="category-nav" class="category-nav hidden">
            <a href="#">Action</a>
            <a href="#">Adventure</a>
            <a href="#">Puzzle</a>
            <a href="#">Strategy</a>
            <a href="#">Sports</a>
            <a href="#">More...</a>
        </nav>
    </header>

    <main>
        <section id="racing-catalog" class="game-catalog">
            <div class="container">
                <h2>Racing Games</h2>
                <div class="game-grid">
                    <!-- Game cards will be added here -->
                    <div class="game-card">
                        <a href="games/sample-game/">
                            <img src="games/sample-game/images/thumbnail.png" alt="Sample Game">
                            <div class="game-card-title">Sample Racing Game</div>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section id="shooter-catalog" class="game-catalog">
            <div class="container">
                <h2>Shooter Games</h2>
                <div class="game-grid">
                    <!-- Game cards will be added here -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
