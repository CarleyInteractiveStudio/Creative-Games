<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Creatives Games</title>
    <link rel="icon" href="images/logo/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="images/logo/logo.png" alt="Creatives Games Logo" class="logo">
            <h2>Iniciar Sesión</h2>
            <p>Bienvenido de nuevo a Creatives Games.</p>
            <form class="form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="button">Iniciar Sesión</button>
            </form>
            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="register.html">Crea una</a></p>
                <p><a href="index.html">Volver al inicio</a></p>
            </div>
        </div>
    </div>
</body>
</html>
